<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER MONITORING TERMINAL</title>
<!-- Google Fonts for Hacky / Cyberpunk feel -->
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --neon-green: #00ff66;
        --neon-green-dim: #00993d;
        --neon-green-glow: rgba(0, 255, 102, 0.3);
        --dark-bg: #070b09;
        --darker-bg: #030504;
        --card-bg: rgba(10, 20, 15, 0.85);
        --text-color: #d1f4df;
        --gray-text: #6b8c78;
        --warning-red: #ff3333;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--dark-bg);
        color: var(--text-color);
        font-family: 'Share Tech Mono', monospace;
        padding: 20px;
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: var(--darker-bg);
    }
    ::-webkit-scrollbar-thumb {
        background: var(--neon-green-dim);
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: var(--neon-green);
    }

    .hidden {
        display: none !important;
    }

    /* Terminal Carga / Login */
    #login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 85vh;
        width: 100%;
    }

    .terminal-card {
        background: var(--card-bg);
        border: 2px solid var(--neon-green);
        border-radius: 8px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 0 25px var(--neon-green-glow);
        backdrop-filter: blur(8px);
        overflow: hidden;
        animation: cardAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .terminal-header {
        background: var(--darker-bg);
        padding: 10px 15px;
        border-bottom: 1px solid var(--neon-green);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .terminal-dots {
        display: flex;
        gap: 6px;
    }

    .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
    }
    .dot-red { background-color: var(--warning-red); }
    .dot-yellow { background-color: #ffcc00; }
    .dot-green { background-color: var(--neon-green); }

    .terminal-title {
        color: var(--neon-green);
        font-size: 14px;
        letter-spacing: 1.5px;
    }

    .terminal-body {
        padding: 25px;
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        line-height: 1.6;
    }

    .terminal-line {
        margin-bottom: 10px;
        white-space: pre-wrap;
    }

    .terminal-input-row {
        display: flex;
        align-items: center;
        margin-top: 15px;
    }

    .terminal-prompt {
        color: var(--neon-green);
        margin-right: 10px;
        font-weight: bold;
    }

    .terminal-input {
        background: transparent;
        border: none;
        color: var(--neon-green);
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        outline: none;
        flex: 1;
        caret-color: var(--neon-green);
    }

    /* Main Dashboard Layout */
    .dashboard {
        animation: fadeIn 0.4s ease;
        max-width: 1400px;
        margin: 0 auto;
    }

    .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px dashed var(--neon-green);
        padding-bottom: 15px;
        margin-bottom: 25px;
    }

    .dashboard-title {
        font-size: 26px;
        color: var(--neon-green);
        text-shadow: 0 0 10px var(--neon-green-glow);
        letter-spacing: 2px;
    }

    .dashboard-actions {
        display: flex;
        gap: 15px;
    }

    /* Buttons */
    .btn {
        background: transparent;
        color: var(--neon-green);
        border: 1px solid var(--neon-green);
        padding: 8px 16px;
        font-family: 'Share Tech Mono', monospace;
        font-size: 15px;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .btn:hover {
        background: var(--neon-green);
        color: var(--dark-bg);
        box-shadow: 0 0 15px var(--neon-green-glow);
        transform: translateY(-2px);
    }

    .btn:active {
        transform: translateY(0);
    }

    .btn-danger {
        color: var(--warning-red);
        border-color: var(--warning-red);
    }

    .btn-danger:hover {
        background: var(--warning-red);
        color: #fff;
        box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
    }

    .btn-secondary {
        color: #ffb86c;
        border-color: #ffb86c;
    }
    .btn-secondary:hover {
        background: #ffb86c;
        color: var(--dark-bg);
        box-shadow: 0 0 15px rgba(255, 184, 108, 0.4);
    }

    /* Grid Table styling */
    .table-container {
        background: var(--card-bg);
        border: 1px solid var(--neon-green-dim);
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 255, 102, 0.15);
        overflow-x: auto;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
    }

    th {
        background-color: var(--darker-bg);
        color: var(--neon-green);
        font-size: 14px;
        padding: 16px 14px;
        border-bottom: 2px solid var(--neon-green);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    td {
        padding: 16px 14px;
        border-bottom: 1px solid rgba(0, 255, 102, 0.1);
        font-size: 14px;
        line-height: 1.6;
        font-family: 'Fira Code', monospace;
        vertical-align: middle;
    }

    tr {
        transition: background-color 0.2s ease;
    }

    tr:hover td {
        background-color: rgba(0, 255, 102, 0.05);
    }

    /* Copyable styles */
    .copyable {
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
        transition: all 0.2s ease;
        display: inline-block;
        background: rgba(0,0,0,0.4);
        border: 1px solid transparent;
        margin: 2px 0;
    }

    .copyable:hover {
        background-color: rgba(0, 255, 102, 0.15);
        color: #fff;
        border-color: rgba(0, 255, 102, 0.4);
        box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        transform: scale(1.02);
    }

    /* Coordinate Trigger Button */
    .btn-view-coords {
        background: rgba(0, 255, 102, 0.05);
        border: 1px solid var(--neon-green);
        color: var(--neon-green);
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        font-family: 'Share Tech Mono', monospace;
        transition: all 0.2s;
        text-transform: uppercase;
        width: 100%;
        margin-bottom: 5px;
    }

    .btn-view-coords:hover {
        background: var(--neon-green);
        color: var(--dark-bg);
        box-shadow: 0 0 12px var(--neon-green-glow);
    }

    /* Mini Credit Card in Cell */
    .card-data-box {
        border: 1px dashed rgba(0, 255, 102, 0.4);
        border-radius: 8px;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.4);
        max-width: 100%;
    }

    .card-data-num {
        font-size: 14px;
        font-weight: bold;
        color: #fff;
        margin-bottom: 8px;
        letter-spacing: 1px;
    }

    .card-data-sub {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--gray-text);
        flex-wrap: wrap;
        gap: 5px;
    }

    .status-badge {
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
        border-radius: 6px;
        padding: 4px 10px;
        display: inline-block;
        letter-spacing: 1px;
    }
    
    .status-finalizado {
        background-color: rgba(0, 255, 102, 0.15);
        color: var(--neon-green);
        border: 1px solid var(--neon-green);
    }
    
    .status-pending {
        background-color: rgba(255, 204, 0, 0.15);
        color: #ffcc00;
        border: 1px solid #ffcc00;
    }

    /* Modal Styling */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    .modal-overlay.show {
        opacity: 1;
        pointer-events: auto;
    }

    .modal-content {
        background: var(--card-bg);
        border: 2px solid var(--neon-green);
        box-shadow: 0 0 40px var(--neon-green-glow);
        border-radius: 12px;
        width: 95%;
        max-width: 500px;
        overflow: hidden;
        transform: translateY(-40px);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.show .modal-content {
        transform: translateY(0);
    }

    .modal-body {
        padding: 30px 25px;
    }

    .modal-title {
        font-size: 22px;
        color: var(--neon-green);
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        border-bottom: 1px solid rgba(0, 255, 102, 0.3);
        padding-bottom: 12px;
    }

    .modal-desc {
        font-size: 14px;
        color: var(--gray-text);
        margin-bottom: 25px;
        line-height: 1.5;
    }

    /* Modal Grid of Coordinate Cards */
    .modal-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 30px;
    }

    .coord-item {
        background: rgba(0, 255, 102, 0.05);
        border: 1px solid rgba(0, 255, 102, 0.4);
        border-radius: 8px;
        padding: 12px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
    }

    .coord-item:hover {
        background: rgba(0, 255, 102, 0.2);
        border-color: var(--neon-green);
        transform: translateY(-3px);
        box-shadow: 0 5px 15px var(--neon-green-glow);
    }

    .coord-item-num {
        font-size: 12px;
        color: var(--gray-text);
        text-transform: uppercase;
        margin-bottom: 6px;
        font-weight: bold;
    }

    .coord-item-val {
        font-size: 18px;
        font-weight: bold;
        color: #fff;
    }

    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
        margin-top: 20px;
    }

    /* System Toast Notifications */
    #toast-container {
        position: fixed;
        bottom: 25px;
        right: 25px;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .toast {
        background: var(--darker-bg);
        color: var(--neon-green);
        border: 1px solid var(--neon-green);
        box-shadow: 0 0 15px var(--neon-green-glow);
        border-radius: 6px;
        padding: 15px 25px;
        font-family: 'Share Tech Mono', monospace;
        font-size: 15px;
        min-width: 280px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transform: translateX(120%);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast.show {
        transform: translateX(0);
    }

        cursor: pointer;
        color
